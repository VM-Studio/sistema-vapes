# Backup diario de la base: 04:00 hora Argentina (07:00 UTC).
# Corre en GitHub Actions porque las funciones de Vercel no traen pg_dump.
# Resultado registrado en la tabla Backup (visible en /configuracion/backups);
# si falla, notificación a los dueños y el job queda en rojo.
name: Backup diario

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.22.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cliente de Postgres 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-16
      - name: Backup
        run: pnpm backup --origen=cron
        env:
          PG_DUMP_PATH: /usr/lib/postgresql/16/bin/pg_dump
          PG_RESTORE_PATH: /usr/lib/postgresql/16/bin/pg_restore
